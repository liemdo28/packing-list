# ============================================================
# Cloudflare Tunnel Configuration Template
# ============================================================
# Copy this file to ~/.cloudflared/config.yml on your origin server.
# Fill in TUNNEL_ID from: cloudflared tunnel create packing-list-prod
# ============================================================

# Tunnel ID — shown after running: cloudflared tunnel create <name>
tunnel: PASTE_TUNNEL_ID_HERE

# Credentials file — auto-created by cloudflared, no need to change
credentials-file: /root/.cloudflared/TUNNEL_ID.json

ingress:
  # Route api.yourdomain.com → backend on localhost:3001
  - hostname: api.yourdomain.com
    service: http://localhost:3001
    originRequest:
      noTLSVerify: false          # set true only if backend has self-signed cert
      connectTimeout: 30s
      tlsTimeout: 10s

  # Catch-all: return 404 for unmatched hostnames
  - service: http_status:404

# Log level: debug | info | warn | error | fatal
logLevel: info

# Transport (default: auto — picks quic if supported)
protocol: auto
