# ============================================================
# Nginx — api.bakudanramen.com → Node.js :3001
# ============================================================
#
# Requirements:
#   sudo apt install nginx certbot python3-certbot-nginx
#
# Setup steps (run once on the origin server):
#   1. Copy this file to /etc/nginx/sites-available/api.bakudanramen.com
#   2. sudo ln -s /etc/nginx/sites-available/api.bakudanramen.com \
#                 /etc/nginx/sites-enabled/api.bakudanramen.com
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#   5. sudo certbot --nginx -d api.bakudanramen.com
#      (auto-issues Let's Encrypt cert and rewrites this file)
#
# After cert is issued, certbot adds the ssl_certificate lines
# and sets up the HTTP→HTTPS redirect automatically.
#
# DNS prerequisite:
#   A   api   →  <your-server-public-IP>   (at your DNS provider)
#   Wait for propagation, then run certbot.
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.bakudanramen.com;

    # Allow Let's Encrypt ACME challenge before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy to Node.js
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bakudanramen.com;

    # SSL certificates (managed by certbot — do not edit manually)
    ssl_certificate     /etc/letsencrypt/live/api.bakudanramen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bakudanramen.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health endpoint — no auth, used by monitoring
    location = /health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        access_log off;
    }

    # All API routes
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Required for proper proxying
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (Google Sheets sync can take up to 30s)
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Body size — allow JSON exports up to 10MB (matches Express config)
        client_max_body_size 10m;

        # CORS is handled by Express — do not add nginx CORS headers here
    }

    # Block everything else
    location / {
        return 404;
    }

    # Logs
    access_log /var/log/nginx/api.bakudanramen.com.access.log;
    error_log  /var/log/nginx/api.bakudanramen.com.error.log warn;
}
