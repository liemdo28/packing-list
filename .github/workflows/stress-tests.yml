name: Stress Tests

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke+concurrency'
        type: choice
        options:
          - smoke+concurrency
          - full
          - soak-only
  schedule:
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'
  DB_NAME: packing_list
  DB_USER: root
  DB_PASSWORD: password

# ─── Reusable setup snippet (embedded per-job — each runner is isolated) ─────
# Each job that needs the API must start its own MySQL service + API server.
# Jobs cannot share a running process across GitHub Actions runner boundaries.

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Core tests: smoke + concurrency + order-flow + summary
  # Runs on every push. Single job = single runner = shared DB + API process.
  # ────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'push' ||
      github.event.inputs.test_suite == 'smoke+concurrency' ||
      github.event.inputs.test_suite == 'full' ||
      github.event.inputs.test_suite == ''

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: v2-react/server/package-lock.json

      - name: Install server dependencies
        working-directory: v2-react/server
        run: npm ci

      - name: Write .env
        run: |
          cat > v2-react/server/.env << 'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=${{ env.DB_NAME }}
          DB_USER=${{ env.DB_USER }}
          DB_PASS=${{ env.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-test-jwt-secret' }}
          PORT=3001
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Migrate and seed database
        working-directory: v2-react/server
        run: |
          npm run migrate
          npm run seed

      - name: Start API server
        working-directory: v2-react/server
        run: |
          node src/index.js &
          echo "Waiting for API..."
          for i in {1..30}; do
            curl -sf http://localhost:3001/health > /dev/null 2>&1 && echo "API ready" && break || true
            sleep 1
          done
          curl -s -o /dev/null -w "API HTTP status: %{http_code}\n" http://localhost:3001/health
        shell: bash

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Create reports directory
        run: mkdir -p stress/reports

      - name: Smoke test
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
        run: k6 run --out json=stress/reports/smoke.json stress/k6/smoke.js

      - name: Concurrency test (20 VUs, complete action)
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
          ACTION: complete
          CONCURRENT_USERS: '20'
        run: k6 run --out json=stress/reports/concurrency-complete.json stress/k6/same-order-concurrency.js

      - name: DB integrity check after concurrency
        run: |
          mysql -u root -p"${{ env.DB_PASSWORD }}" ${{ env.DB_NAME }} \
            < stress/sql/integrity-checks.sql

      - name: Order flow load test
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
        run: k6 run --out json=stress/reports/order-flow.json stress/k6/order-flow.js

      - name: Summary load test
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
          YEAR: '2026'
          MONTH: '4'
        run: k6 run --out json=stress/reports/summary-load.json stress/k6/summary-load.js

      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: stress/reports/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Export load test — manual full suite only
  # Self-contained: starts its own MySQL service + API
  # ────────────────────────────────────────────────────────────────────────────
  export-load:
    name: Export Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.test_suite == 'full'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: v2-react/server/package-lock.json

      - name: Install server dependencies
        working-directory: v2-react/server
        run: npm ci

      - name: Write .env
        run: |
          cat > v2-react/server/.env << 'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=${{ env.DB_NAME }}
          DB_USER=${{ env.DB_USER }}
          DB_PASS=${{ env.DB_PASSWORD }}
          JWT_SECRET=ci-test-jwt-secret
          PORT=3001
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Migrate and seed
        working-directory: v2-react/server
        run: npm run migrate && npm run seed

      - name: Start API server
        working-directory: v2-react/server
        run: |
          node src/index.js &
          for i in {1..30}; do
            curl -sf http://localhost:3001/health > /dev/null 2>&1 && break || true; sleep 1
          done
        shell: bash

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Export load test
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
        run: |
          mkdir -p stress/reports
          k6 run --out json=stress/reports/export-load.json stress/k6/export-load.js

      - name: Upload export report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-report
          path: stress/reports/export-load.json
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Soak test — nightly schedule or manual soak-only trigger
  # Self-contained: starts its own MySQL service + API
  # ────────────────────────────────────────────────────────────────────────────
  soak:
    name: Soak Test (60 min)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.inputs.test_suite == 'soak-only' || github.event_name == 'schedule'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: v2-react/server/package-lock.json

      - name: Install server dependencies
        working-directory: v2-react/server
        run: npm ci

      - name: Write .env
        run: |
          cat > v2-react/server/.env << 'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=${{ env.DB_NAME }}
          DB_USER=${{ env.DB_USER }}
          DB_PASS=${{ env.DB_PASSWORD }}
          JWT_SECRET=ci-test-jwt-secret
          PORT=3001
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Migrate and seed
        working-directory: v2-react/server
        run: npm run migrate && npm run seed

      - name: Start API server
        working-directory: v2-react/server
        run: |
          node src/index.js &
          for i in {1..30}; do
            curl -sf http://localhost:3001/health > /dev/null 2>&1 && break || true; sleep 1
          done
        shell: bash

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Soak test (60 min)
        env:
          BASE_URL: http://localhost:3001/api
          ADMIN_USER: admin
          ADMIN_PASSWORD: password
          SOAK_VUS: '10'
          K6_DURATION: '60m'
        run: |
          mkdir -p stress/reports
          k6 run --out json=stress/reports/soak.json stress/k6/soak-mixed.js

      - name: Post-soak DB integrity checks
        run: |
          mysql -u root -p"${{ env.DB_PASSWORD }}" ${{ env.DB_NAME }} \
            < stress/sql/integrity-checks.sql
          mysql -u root -p"${{ env.DB_PASSWORD }}" ${{ env.DB_NAME }} \
            < stress/sql/summary-rebuild-check.sql

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: stress/reports/soak.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Quality gate — fails the run if test-core did not pass
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: Quality Gate
    needs: [test-core]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Evaluate gate
        run: |
          echo "test-core result: ${{ needs.test-core.result }}"
          if [ "${{ needs.test-core.result }}" = "success" ]; then
            echo "QUALITY GATE PASSED"
          else
            echo "QUALITY GATE FAILED"
            exit 1
          fi
