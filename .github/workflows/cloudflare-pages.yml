name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'v2-react/client/**'
      - 'functions/**'
      - '.github/workflows/cloudflare-pages.yml'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2-react/client/package-lock.json

      - name: Install dependencies
        working-directory: v2-react/client
        run: npm ci

      - name: Build
        working-directory: v2-react/client
        run: npm run build
        env:
          # Phase 1: use relative /api — Cloudflare Pages Function proxies to tunnel.
          # Phase 2: set VITE_API_BASE_URL=https://api.bakudanramen.com/api in repo vars
          # to bypass the Pages Function once the subdomain DNS is stable.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://packinglist.bakudanramen.com' }}

      - name: Copy Cloudflare Functions into dist
        run: cp -r functions v2-react/client/dist/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'packing-list-1' }}
          directory: v2-react/client/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: master

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2-react/client/package-lock.json

      - name: Install dependencies
        working-directory: v2-react/client
        run: npm ci

      - name: Build
        working-directory: v2-react/client
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_URL: https://packinglist.bakudanramen.com

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: v2-react/client/dist
          retention-days: 7
